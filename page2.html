<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .slider {
      width: 80%;
      height: 400px;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      display: flex;
      gap: 20px;
      padding: 20px;
      border-radius: 12px;
      scroll-behavior: smooth;
      background: #222;
    }

    .slider::-webkit-scrollbar {
      display: none; /* hide scrollbar */
    }

    .slide {
      flex: 0 0 80%;
      height: 100%;
      scroll-snap-align: center;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Optional: navigation buttons */
    .buttons {
      position: absolute;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .buttons button {
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      font-size: 24px;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 50%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="slider" id="slider">
    <div class="slide"><img src="https://picsum.photos/id/1015/800/400" alt=""></div>
    <div class="slide"><img src="https://picsum.photos/id/1024/800/400" alt=""></div>
    <div class="slide"><img src="https://picsum.photos/id/1035/800/400" alt=""></div>
    <div class="slide"><img src="https://picsum.photos/id/1043/800/400" alt=""></div>
  </div>

  <div class="buttons">
    <button id="prev">&#10094;</button>
    <button id="next">&#10095;</button>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const nextBtn = document.getElementById('next');
    const prevBtn = document.getElementById('prev');

    const slideWidth = slider.querySelector('.slide').offsetWidth + 20; // width + gap

    nextBtn.addEventListener('click', () => {
      slider.scrollBy({ left: slideWidth, behavior: 'smooth' });
    });

    prevBtn.addEventListener('click', () => {
      slider.scrollBy({ left: -slideWidth, behavior: 'smooth' });
    });
  </script>
</body>
</html>
